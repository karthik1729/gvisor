name: kloudlite-build
on:
  workflow_dispatch:
  push:
    branches: [kloudlite-release]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.26.4
      - name: Build
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o out/runsc ./runsc
          go build -trimpath -o out/containerd-shim-runsc-v1 ./shim
          (cd out && sha512sum runsc containerd-shim-runsc-v1 > SHA512SUMS)
          { echo '```'; cat out/SHA512SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="kl-$(git rev-parse --short=8 HEAD)"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" out/runsc out/containerd-shim-runsc-v1 out/SHA512SUMS \
            --target "$GITHUB_SHA" --title "$tag" --notes "Patched gVisor build of $GITHUB_SHA" --latest
